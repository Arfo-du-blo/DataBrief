# Tests, on every push to main and on every pull request (and on demand).
#   browser-and-servers  the page in headless Chrome (formats, relationships, profile, "Do not share data" canaries,
#                        15 languages, the privacy demo) and the Python and Node.js servers; also checks that the
#                        committed databrief.html is exactly what build.ps1 produces from the sources
#   cli                  the command-line tool on Linux, Windows and macOS with Node 18, 22 and 24 (and its packages, except on Windows)
#   mcp                  the hosted MCP server (protocol, tool, widget resource, limits, no content in the log) and the texts and the
#                        build of the widget layer, with Node 18, 22 and 24
#   packages             the .deb in clean Ubuntu and Debian systems (Docker): on version tags and on demand
#   powershell           the PowerShell server, on Windows
#   docker               both Docker images (amd64 and arm64 under emulation) and the MCP server's image (amd64), Compose, the Raspberry Pi script and the
#                        web server configuration files: on version tags and on demand (heavy)
#   esp32                the ESP32 firmware compiled for three boards: on demand only (downloads the toolchains, several GB)
name: Tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-and-servers:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      # databrief.html (and the demo pages made from it) must be reproducible. The settings page embeds a gzip copy whose
      # bytes depend on the compressor of the platform, so it is not compared.
      - name: The committed HTML matches the sources
        shell: pwsh
        run: |
          ./build.ps1
          git diff --exit-code -- databrief.html examples/tampered

      - name: Test environment (Node, Puppeteer with Chrome, Python)
        run: bash tests/setup_testenv.sh

      - name: Browser tests (formats, relationships, profile, Do not share data, languages, privacy demo)
        run: bash tests/run.sh

      - name: Server tests (Python and Node.js)
        run: bash tests/test_servers.sh

  # The command-line tool (cli/): its tests on Linux, Windows and macOS with the oldest and the newest Node versions it supports.
  # They need no browser: options, clipboard commands (with stand-ins), output folders, --review (fake editors), the one-file
  # build (reproducible, the same bytes from CRLF sources) and real processes on the committed test files.
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        node: ['18', '22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Reading core (the page's code in Node)
        run: node tests/test_core.cjs
      - name: Command-line tool
        run: node tests/test_cli.cjs
      - name: Do not share data, no network, hostile names, special files (files written by the test)
        run: node tests/test_cli_privacy.cjs
      - name: Build the one-file tool
        run: node tools/build-cli.cjs
      - name: Run it
        run: node dist/databrief-cli.cjs tests/v14-fixtures/doc-fixtures/report.docx --no-copy --print --no-share
      # The npm package (packed, installed with npm install -g, run), the Homebrew formula and Scoop manifest, the .deb (Linux).
      - name: Packages
        if: runner.os != 'Windows'
        run: node tests/test_packages.cjs

  # The hosted MCP server (mcp/): the protocol conversation, the tool and the widget resource, the limits, and the canaries that the
  # log never shows. No browser, no dependency. On Windows and macOS too: the Claude Desktop extension runs there (and --root has
  # Windows-only rules: letter case, network paths).
  mcp:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        node: ['18', '22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Hosted MCP server
        run: node tests/test_mcp.cjs
      - name: Widget layer (texts in 15 languages, the build, no network call; the browser part is in browser-and-servers)
        run: node tests/test_widget.cjs
      - name: Claude Desktop extension (.mcpb build, the server over stdio, same prompt as the command-line tool)
        run: node tests/test_mcpb.cjs
      - name: databrief --mcp (MCP server, --root, Do not share data, no subprocess)
        run: node tests/test_cli_mcp.cjs
      - name: Release files (the script, the Compose file that pulls the image, the workflows are valid YAML)
        run: node tests/test_release.cjs
      - name: Claude plugin (layout, manifest, .mcp.json, the bundled tool run from the plugin)
        run: node tests/test_plugin.cjs
      - name: Terminal pack (skill and snippet, the documented commands run from the built skill)
        run: node tests/test_agents.cjs

  powershell:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: PowerShell server tests
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\test_powershell.ps1

  # The .deb installed in clean Ubuntu 26.04, 24.04, 22.04 and Debian systems (Docker), lintian, the Homebrew formula's Ruby syntax.
  packages:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Packages in clean systems
        run: bash tests/test_packages.sh

  docker:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Test environment
        run: bash tests/setup_testenv.sh
      - name: Docker tests (images, Compose, Raspberry Pi script, web server configuration)
        run: bash tests/test_docker.sh
      - name: Hosted MCP server image (read-only, no capability, health check, stop)
        run: bash tests/test_mcp_docker.sh

  esp32:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: PlatformIO
        run: |
          python3 -m venv "$HOME/databrief-esp-testenv/venv"
          "$HOME/databrief-esp-testenv/venv/bin/pip" install platformio
      - name: ESP32 tests (header generators, firmware for three boards)
        run: bash tests/test_esp32.sh
