# On a version tag (git tag v1.1.0 && git push origin v1.1.0):
#   1. a GitHub release with databrief.html, databrief_set_default.html and SHA256SUMS.txt (their fingerprints,
#      see docs/verify-privacy.md) attached
#   2. Docker images on GitHub Container Registry, for PCs (linux/amd64) and ARM boards such as the Raspberry Pi
#      (linux/arm64); Docker picks the right one automatically:
#        ghcr.io/<owner>/databrief:latest, :nginx, :<version>, :<version>-nginx   (nginx variant)
#        ghcr.io/<owner>/databrief:python, :<version>-python                      (Python variant)
# After the first release: GitHub profile > Packages > databrief > Package settings > Change visibility > Public
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build the HTML files from the sources
        shell: pwsh
        run: ./build.ps1

      - name: Fingerprints (SHA-256) of the released files
        run: sha256sum databrief.html databrief_set_default.html | tee SHA256SUMS.txt

      - name: Create (or update) the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # the tag was pushed again: replace the files of the existing release
            gh release upload "$GITHUB_REF_NAME" databrief.html databrief_set_default.html SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" databrief.html databrief_set_default.html SHA256SUMS.txt \
              --title "DataBrief $GITHUB_REF_NAME" --generate-notes
          fi

      - name: Image name (registry names must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/databrief" >> "$GITHUB_ENV"

      # QEMU lets this PC-based runner build the ARM (Raspberry Pi) images too.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: nginx image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:nginx
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:${{ github.ref_name }}-nginx

      - name: Python image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile.python
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:python
            ${{ env.IMAGE }}:${{ github.ref_name }}-python
