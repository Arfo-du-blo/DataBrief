# DataBrief on a Raspberry Pi - systemd drop-in for deploy/systemd/databrief-python.service.
# Installed by setup.sh as /etc/systemd/system/databrief-python.service.d/low-port.conf
# It lets the service, which does not run as root, listen on a port below 1024 (80 = no port in the address).
# It gives that single permission and nothing else.
[Service]
AmbientCapabilities=CAP_NET_BIND_SERVICE
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
