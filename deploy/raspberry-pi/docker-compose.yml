# DataBrief on a Raspberry Pi with Docker - a minimal Compose file (the image is multi-architecture:
# Docker pulls the ARM version on a Pi automatically). Installed by setup.sh --docker as /opt/databrief/docker-compose.yml
#   docker compose -f /opt/databrief/docker-compose.yml up -d      start (and after each edit)
#   docker compose -f /opt/databrief/docker-compose.yml pull && docker compose -f /opt/databrief/docker-compose.yml up -d   update
# Every setting: deploy/docker/docker-compose.yml and the README, "Settings".
services:
  databrief:
    image: ghcr.io/arfo-du-blo/databrief:latest
    container_name: databrief
    restart: unless-stopped
    ports:
      - "${DATABRIEF_PUBLIC_PORT:-80}:8080"
    environment:
      DATABRIEF_LANG: ""          # e.g. fr; empty = visitor's choice
      DATABRIEF_MODE: "inline"    # inline or files
      DATABRIEF_LOCK: ""          # e.g. lang,mode
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
