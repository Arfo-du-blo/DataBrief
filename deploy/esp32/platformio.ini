; DataBrief on an ESP32 - PlatformIO project (VS Code + PlatformIO extension, or the pio command).
; Step-by-step guide: docs/esp32-arduino.md
;
;   cd deploy/esp32
;   pio run -e esp32dev -t upload        build and flash (pick your board below)
;   pio device monitor                   see the address of the board
;
; The firmware is the Arduino sketch DataBrief/DataBrief.ino (the same file the Arduino IDE uses).
; Before each build, make_header.py compresses ../../databrief.html into DataBrief/databrief_html.h.
; To embed another file (a team version), set DATABRIEF_HTML=/path/to/databrief.html before building.

[platformio]
src_dir = DataBrief
default_envs = esp32dev

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
extra_scripts = pre:make_header.py

; Classic ESP32 with 4 MB of flash (ESP32-DevKitC, ESP32-WROOM-32 boards...).
; "huge_app": 3 MB for the firmware, which holds the page (about 0.9 MB compressed).
[env:esp32dev]
board = esp32dev
board_build.partitions = huge_app.csv

; ESP32-S3 with 8 MB of flash or more (ESP32-S3-DevKitC-1...).
[env:esp32-s3]
board = esp32-s3-devkitc-1
board_build.partitions = default_8MB.csv

; Arduino Nano ESP32 (ESP32-S3, 16 MB). Its default partitions already give 3 MB to the firmware.
[env:arduino_nano_esp32]
board = arduino_nano_esp32
