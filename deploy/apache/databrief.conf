# =====================================================================================
#  DataBrief - Apache HTTP Server (2.4) virtual host
#  Copy to /etc/apache2/sites-available/databrief.conf (Debian/Ubuntu) or /etc/httpd/conf.d/ (RHEL), then:
#      sudo a2enmod headers ssl proxy proxy_http deflate rewrite
#      sudo a2ensite databrief && sudo apachectl configtest && sudo systemctl reload apache2
#
#  A. Apache serves databrief.html itself (settings: make the file with databrief_set_default.html)
#  B. Apache is a reverse proxy in front of a DataBrief server or Docker container (settings: on that server)
#  HTTPS and passwords are handled here, in Apache.
# =====================================================================================

<VirtualHost *:80>
    ServerName databrief.example.com
    Redirect permanent / https://databrief.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName databrief.example.com

    SSLEngine on
    SSLCertificateFile    /etc/ssl/databrief/fullchain.pem
    SSLCertificateKeyFile /etc/ssl/databrief/privkey.pem

    ServerSignature Off
    Header always set Content-Security-Policy "frame-ancestors 'self'"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    Header always set Strict-Transport-Security "max-age=31536000"
    AddOutputFilterByType DEFLATE text/html text/plain

    # ===== A. Apache serves the file ====================================================
    DocumentRoot /var/www/databrief
    DirectoryIndex databrief.html
    <Directory /var/www/databrief>
        Options -Indexes
        AllowOverride None
        Require all granted
        Header set Cache-Control "no-cache"
        # Optional password: sudo htpasswd -c /etc/apache2/databrief.htpasswd alice
        # AuthType Basic
        # AuthName "DataBrief"
        # AuthUserFile /etc/apache2/databrief.htpasswd
        # Require valid-user
    </Directory>

    # ===== B. reverse proxy (remove block A, uncomment) =================================
    # ProxyPreserveHost On
    # ProxyPass        / http://127.0.0.1:8080/
    # ProxyPassReverse / http://127.0.0.1:8080/
</VirtualHost>
