# =====================================================================================
#  DataBrief - nginx configuration
#  Copy to /etc/nginx/conf.d/databrief.conf (or sites-available/), adapt, then:
#      sudo nginx -t && sudo systemctl reload nginx
#
#  Two ways to use it (choose one "location /" block below):
#   A. nginx serves databrief.html itself (your settings: make the file with databrief_set_default.html)
#   B. nginx is a reverse proxy in front of the Python / Node / PowerShell server or a Docker container
#      (your settings: databrief.conf or DATABRIEF_* variables of that server)
#  HTTPS and passwords are handled here, in nginx (the DataBrief servers stay plain HTTP on localhost).
# =====================================================================================

# --- HTTP: redirect everything to HTTPS (remove this block if you only use HTTP inside your network)
server {
    listen 80;
    server_name databrief.example.com;            # <- your host name
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name databrief.example.com;            # <- your host name

    # --- HTTPS certificate (for example from Let's Encrypt: sudo certbot --nginx -d databrief.example.com)
    ssl_certificate     /etc/ssl/databrief/fullchain.pem;
    ssl_certificate_key /etc/ssl/databrief/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    gzip on;
    gzip_types text/html text/plain;

    # Security headers. frame-ancestors: sites allowed to show DataBrief in a frame
    # (for SharePoint / Teams: 'self' https://yourcompany.sharepoint.com https://teams.microsoft.com).
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # --- Optional password (basic auth). Create the file with:
    #       sudo apt install apache2-utils && sudo htpasswd -c /etc/nginx/databrief.htpasswd alice
    # auth_basic "DataBrief";
    # auth_basic_user_file /etc/nginx/databrief.htpasswd;

    # --- Optional: allow only your network
    # allow 10.0.0.0/8;
    # allow 192.168.0.0/16;
    # deny all;

    # ===== A. nginx serves the file =====================================================
    root /var/www/databrief;                      # contains databrief.html
    location = / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files /databrief.html =404;
    }
    location = /databrief.html { try_files /databrief.html =404; }
    location / { return 404; }

    # ===== B. reverse proxy (comment out block A, uncomment this one) ===================
    # location / {
    #     proxy_pass http://127.0.0.1:8080;       # Python/Node/PowerShell server or Docker container
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # ===== Serve under a sub-path instead, e.g. https://intranet.example.com/databrief/ ====
    # With a DataBrief server: set DATABRIEF_BASE_PATH=/databrief/ there, then:
    # location /databrief/ { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; }
}
