# =====================================================================================
#  DataBrief - configuration file
#  Read by: deploy/python/serve.py, deploy/node/server.js, deploy/powershell/serve.ps1
#           and the Docker images (mount it as /config/databrief.conf).
#
#  Format : KEY=value   (one per line, "#" starts a comment)
#           Use double quotes for values with spaces; inside quotes, \n is a new line.
#  Priority: command-line option > environment variable > this file > built-in default.
#  An empty value (KEY=) means "not set": the built-in default is used.
#  Tip: run the server with --setup (PowerShell: -Setup) to answer questions instead
#       of editing this file; it can save your answers here.
# =====================================================================================

# ---------------------------------------------------------------- page settings ------
# Interface language: en fr es de it pt nl pl ru tr zh ja ko hi ar (empty = visitor's choice, English first)
DATABRIEF_LANG=

# Prompt language (same codes; empty = same as the interface)
DATABRIEF_PROMPT_LANG=

# How the data is given to the AI: inline (inside the prompt) | files (separate CSV files)
DATABRIEF_MODE=inline

# Data layout: auto | table | csv
DATABRIEF_LAYOUT=auto

# Theme: system | light | dark
DATABRIEF_THEME=system

# Sample rows per section in CSV-files mode (1-100)
DATABRIEF_SAMPLE_ROWS=5

# Show the large-file warning above this many tokens
DATABRIEF_WARN_TOKENS=150000

# Settings to lock (fixed to the value above and hidden from users), comma-separated:
#   lang, promptLang, mode, layout, theme   -> setting fixed and its selector hidden
#   limit, edit, view                       -> row-limit control / Edit button / View formatted button hidden
# Example: DATABRIEF_LOCK=lang,mode,edit
DATABRIEF_LOCK=

# Your team's prompt text (empty = DataBrief's text, translated). Use \n for new lines.
#   INTRO: the sentence under the title
#   RESPOND / RESPOND_FILES: the "How to respond" part, data inside the prompt / CSV-files mode
DATABRIEF_PROMPT_INTRO=
DATABRIEF_PROMPT_RESPOND=
DATABRIEF_PROMPT_RESPOND_FILES=

# -------------------------------------------------------------- server settings ------
# Address to listen on: 0.0.0.0 = every network interface (team access), 127.0.0.1 = this computer only
DATABRIEF_HOST=0.0.0.0

# Port
DATABRIEF_PORT=8080

# Requests served at the same time (Python and PowerShell: worker threads)
DATABRIEF_THREADS=8

# Maximum open connections (Node.js; nginx: worker_connections)
DATABRIEF_MAX_CONNECTIONS=256

# URL path where DataBrief is served, e.g. / or /databrief/
DATABRIEF_BASE_PATH=/

# Log every request: true | false
DATABRIEF_ACCESS_LOG=true

# Sites allowed to show DataBrief inside a frame (Content-Security-Policy frame-ancestors).
# 'self' = only this site. For SharePoint / Teams, add for example:
#   'self' https://yourcompany.sharepoint.com https://teams.microsoft.com
DATABRIEF_FRAME_ANCESTORS='self'

# Path of databrief.html (empty = found automatically next to the server or in the repository)
DATABRIEF_HTML=
